<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Email</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="register-container">
        <div class="register-header">
            <h3>Confirmation number sent to ******@gmail.com</h3>
        </div>

        <form onsubmit="event.preventDefault();">
            <div class="input-group">
                <label for="email">Code:</label>
                <input type="email" id="email" placeholder="Enter code" required>
                <button type="submit" class="resend-email-btn">Resend code</button>

            </div>
            <button type="submit" class="login-btn">Confirm Email</button>

        </form>

    </div>
</body>

</html>
